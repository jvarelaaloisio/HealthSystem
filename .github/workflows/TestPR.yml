name: TestPR

on:
  workflow_dispatch: {}
  pull_request:
    branches: [ main ]

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    - name: Restore NuGet packages
      run: dotnet restore Projects/HealthSystem.sln
    - name: Build
      run: dotnet build Projects/HealthSystem.sln -c Release --no-restore
    - name: Publish build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: build-artifacts
        path: Projects/HealthSystem.UnitTests/bin/Release/
    - name: Log test artifacts
      run: |
        echo "Directory contents for HealthSystem.UnitTests bin/Release:"
        ls -R Projects/HealthSystem.UnitTests/bin/Release/

  Test:
    needs: [Build]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Restore NuGet packages
      run: dotnet restore Projects/HealthSystem.sln
    - name: Run Tests
      run: dotnet test Projects/HealthSystem.UnitTests/HealthSystem.UnitTests.csproj -c Release --no-restore