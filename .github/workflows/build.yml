name: Build and Release

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  Build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Restore NuGet packages
      run: dotnet restore Projects/HealthSystem.sln
    - name: Build
      run: msbuild /p:Configuration=Release Projects/HealthSystem.sln
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: build-artifacts
        path: Projects/HealthSystem/bin/Release/
    - name: Log build artifacts
      run: |
        echo "Directory contents for HealthSystem bin/Release:"
        ls -R Projects/HealthSystem/bin/Release/
    - name: Upload test artifacts
      uses: actions/upload-artifact@v7
      with:
        name: test-artifacts
        path: Projects/HealthSystem.UnitTests/bin/Release/
    - name: Log test artifacts
      run: |
        echo "Directory contents for HealthSystem.UnitTests bin/Release:"
        ls -R Projects/HealthSystem.UnitTests/bin/Release/

  Test:
    needs: [Build]
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Restore NuGet packages
      run: dotnet restore Projects/HealthSystem.sln
    - name: Run Tests
      run: dotnet test Projects/HealthSystem.UnitTests/HealthSystem.UnitTests.csproj -c Release --no-restore

  CreateTagAndRelease:
    needs: [Test]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Get latest release tag
      id: get_tag
      run: |
        CURRENT_TAG=$(curl --silent "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" | jq -r .tag_name)
        if [[ -z "$CURRENT_TAG" || "$CURRENT_TAG" == "null" ]]; then
          echo "::error::Failed to fetch the latest release tag"
          exit 1
        fi
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
    - name: Print current tag
      run: echo "Last tag was ${{ env.CURRENT_TAG }}"
    - name: Update tag
      id: update_tag
      run: |
        CURRENT_TAG=$(echo $CURRENT_TAG | awk 'BEGIN{FS=OFS="."}{print $(NF-2), $(NF-1),$NF+1}')
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        echo "current_tag=$CURRENT_TAG" >> $GITHUB_ENV
    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: build-artifacts
        path: Projects/HealthSystem/bin/Release/
    - name: Log build artifacts
      run: |
        echo "Directory contents for HealthSystem bin/Release:"
        ls -R Projects/HealthSystem/bin/Release/
    - name: Push tag
      run: |
        git fetch --tags
        if ! git rev-parse ${{ env.CURRENT_TAG }} >/dev/null 2>&1; then
          git tag ${{ env.CURRENT_TAG }}
          git push origin ${{ env.CURRENT_TAG }}
        else
          echo "Tag ${{ env.CURRENT_TAG }} already exists"
        fi
    - name: Print Tag
      run: echo "new tag is ${{ env.CURRENT_TAG }}"
    - name: Create Release and Upload DLL
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
      with:
        tag_name: ${{ env.CURRENT_TAG }}
        release_name: Release ${{ env.CURRENT_TAG }}
        draft: false
        prerelease: false
        update_release: true
        files: Projects/HealthSystem/bin/Release/netstandard2.0/VarelaAloisio.HealthSystem.Runtime.dll